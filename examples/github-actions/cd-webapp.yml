# =============================================================================
# CD para Azure App Service: build once → dev → staging (slot) → producción (swap)
# Copia este archivo y reusable-deploy-webapp.yml a .github/workflows/
#
#   build ──► deploy-dev ──► deploy-staging (slot) ──► swap-production
#                                                        (environment con revisores)
#
# Configuración (Settings → Environments): dev, staging, production.
#   * Variables por environment: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   * production: "Required reviewers" + "Deployment branches: main"
#   * Una credencial federada en Entra ID por environment (ver docs/04).
# =============================================================================
name: CD - Web App

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Serializa despliegues: nunca cancelar uno a medias.
concurrency:
  group: cd-webapp
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build y empaquetado
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write       # firma Sigstore para la atestación
      attestations: write   # guardar la atestación
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Publicar
        run: |
          dotnet restore --locked-mode
          dotnet publish src/MiApp.Api/MiApp.Api.csproj --no-restore \
            --configuration Release --output publish
          (cd publish && zip -qr ../webapp.zip .)

      # Procedencia SLSA firmada: permite verificar después que el .zip que
      # corre en producción salió de este repo y de este workflow:
      #   gh attestation verify webapp.zip --repo <owner>/<repo>
      # En repos privados requiere GitHub Enterprise Cloud (quita la condición si lo tienes).
      - name: Atestación de procedencia
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: webapp.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp
          path: webapp.zip
          retention-days: 30
          if-no-files-found: error

  deploy-dev:
    name: Dev
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-deploy-webapp.yml
    with:
      environment: dev
      app-name: app-miapp-dev
      resource-group: rg-miapp-dev

  deploy-staging:
    name: Staging (slot)
    needs: deploy-dev
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-deploy-webapp.yml
    with:
      environment: staging
      app-name: app-miapp-prod
      resource-group: rg-miapp-prod
      slot-name: staging

  swap-production:
    name: Producción (swap)
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.verify.outputs.url }}
    permissions:
      id-token: write
      contents: read
    env:
      APP: app-miapp-prod
      RG: rg-miapp-prod
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # El swap calienta las instancias de staging (WEBSITE_SWAP_WARMUP_PING_PATH)
      # antes de intercambiar el ruteo: cero downtime.
      - name: Swap staging → production
        id: swap
        run: az webapp deployment slot swap -g "$RG" -n "$APP" --slot staging --target-slot production

      - name: Verificar producción
        id: verify
        run: |
          set -euo pipefail
          host=$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            --max-time 10 "https://${host}/healthz"
          echo "url=https://${host}" >> "$GITHUB_OUTPUT"

      # Sólo si el swap ocurrió y algo falló después: un segundo swap regresa
      # la versión anterior, que quedó en el slot staging.
      - name: Rollback automático
        if: failure() && steps.swap.outcome == 'success'
        run: az webapp deployment slot swap -g "$RG" -n "$APP" --slot staging --target-slot production
